server {
    listen 80;
    listen [::]:80;
    server_name myslik.ru www.myslik.ru xn--h1aebdz3d.xn--p1ai www.xn--h1aebdz3d.xn--p1ai;
    return 301 https://myslik.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.myslik.ru xn--h1aebdz3d.xn--p1ai www.xn--h1aebdz3d.xn--p1ai;

    ssl_certificate /etc/letsencrypt/live/myslik.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myslik.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    return 301 https://myslik.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name myslik.ru;

    ssl_certificate /etc/letsencrypt/live/myslik.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myslik.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    root /var/www/myslik;
    index index.html;
    error_page 404 /404.html;

    location = /health {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /pay {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /pay/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
