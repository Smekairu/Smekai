<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Викторина Смекай</title>
<link rel="stylesheet" href="../assets/fonts.css">

<style>
:root{
  --ground:#EEF1F8; --card:#FFFFFF; --card-2:#F5F7FC; --line:#DCE1EE;
  --ink:#1B1F3B; --ink-2:#4A5074; --ink-3:#8389A8;
  --sun:#FFC933; --sun-ink:#5C4300; --sun-soft:#FFF1C7;
  --mint:#20B98A; --mint-soft:#D5F5EA;
  --coral:#F2564B; --coral-soft:#FDE0DD;
  --sky:#3E7BFA; --sky-soft:#DDE8FF;
  --shadow:0 1px 0 rgba(27,31,59,.06),0 10px 30px rgba(27,31,59,.08);
  --display:"Unbounded","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#12152A; --card:#1C2140; --card-2:#232950; --line:#313866;
  --ink:#F1F2FA; --ink-2:#BEC2DE; --ink-3:#8A90B8;
  --sun:#FFCF47; --sun-ink:#2A1F00; --sun-soft:#3A3217;
  --mint:#37D19F; --mint-soft:#163A33; --coral:#FF6F63; --coral-soft:#3F2027;
  --sky:#6D9BFF; --sky-soft:#1F2C55;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 12px 34px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --ground:#12152A; --card:#1C2140; --card-2:#232950; --line:#313866;
  --ink:#F1F2FA; --ink-2:#BEC2DE; --ink-3:#8A90B8;
  --sun:#FFCF47; --sun-ink:#2A1F00; --sun-soft:#3A3217;
  --mint:#37D19F; --mint-soft:#163A33; --coral:#FF6F63; --coral-soft:#3F2027;
  --sky:#6D9BFF; --sky-soft:#1F2C55;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 12px 34px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;padding:16px;padding-block:18px 40px}
button,input{font-family:inherit;font-size:1rem;color:inherit}
button{cursor:pointer;border:none;background:none}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:10px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:clamp(1.7rem,6vw,2.3rem);font-weight:800;line-height:1.05}
h2{font-size:1.25rem;font-weight:700;line-height:1.2}
.bar{display:flex;align-items:center;gap:10px}
.logo{font-family:var(--display);font-weight:800;font-size:1.05rem;display:flex;align-items:center;gap:8px}
.logo i{width:26px;height:26px;border-radius:8px;background:var(--sun);display:grid;place-items:center;font-style:normal;font-size:.9rem;color:var(--sun-ink)}
.sp{flex:1}
.ib{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:1.05rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:20px}
.muted{color:var(--ink-2)}
.small{font-size:.86rem}
.label{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
/* mascot */
.mys{width:128px;height:128px;flex:none}
.mys.sm{width:96px;height:96px}
.mys.lg{width:180px;height:180px;margin:0 auto}
.mys svg{width:100%;height:100%;overflow:visible}
.m-body{transform-box:fill-box;transform-origin:50% 100%;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.m-lid{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.m-pup{animation:look 7s ease-in-out infinite}
@keyframes look{0%,40%,100%{transform:translate(0,0)}45%,58%{transform:translate(-2.5px,0)}63%,76%{transform:translate(2.5px,-1px)}}
.f{opacity:0;transition:opacity .15s}
.mys .f-idle{opacity:1}
.mys.think .f-idle,.mys.yay .f-idle,.mys.oops .f-idle,.mys.party .f-idle{opacity:0}
.mys.think .f-think,.mys.yay .f-yay,.mys.party .f-yay,.mys.oops .f-oops{opacity:1}
.mys.think .m-pup{animation:none;transform:translate(2px,-3px)}
/* лампочка */
.m-bulb{fill:#F4E3A1;transition:fill .2s}
.m-glow{fill:var(--sun);opacity:0;transform-box:fill-box;transform-origin:center}
.m-rays{opacity:0;transform-box:fill-box;transform-origin:center}
.mys .m-glow{animation:idleglow 5s ease-in-out infinite}
@keyframes idleglow{0%,70%,100%{opacity:0}80%,88%{opacity:.35}}
.mys.think .m-bulb{fill:#FFD95C}
.mys.think .m-glow{animation:thinkglow 1.1s ease-in-out infinite}
@keyframes thinkglow{0%,100%{opacity:.15;transform:scale(.9)}50%{opacity:.55;transform:scale(1.15)}}
.mys.yay .m-bulb,.mys.party .m-bulb{fill:#FFE14D}
.mys.yay .m-glow,.mys.party .m-glow{animation:none;opacity:.7;transform:scale(1.3)}
.mys.yay .m-rays,.mys.party .m-rays{opacity:1;animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.mys.oops .m-bulb{fill:#C9CCD9}
.mys.oops .m-glow{animation:none;opacity:0}
.mys.yay .m-body{animation:yay .7s ease}
@keyframes yay{0%{transform:translateY(0) scale(1)}40%{transform:translateY(-16px) scale(1.06) rotate(-6deg)}100%{transform:translateY(0) scale(1)}}
.mys.oops .m-body{animation:oops .55s ease}
@keyframes oops{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.mys.party .m-body{animation:party 1.1s ease-in-out infinite}
@keyframes party{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-18px) rotate(-8deg)}50%{transform:translateY(0) rotate(0)}75%{transform:translateY(-18px) rotate(8deg)}}
.m-arm{transform-box:fill-box;transform-origin:50% 0}
.mys.party .m-arm.l{animation:wave 1.1s ease-in-out infinite}
.mys.party .m-arm.r{animation:wave 1.1s ease-in-out infinite reverse}
.mys.yay .m-arm.l{transform:rotate(40deg)} .mys.yay .m-arm.r{transform:rotate(-40deg)}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(50deg)}}
.m-sparks{opacity:0}
.mys.yay .m-sparks,.mys.party .m-sparks{opacity:1;animation:tw .9s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
.say{display:flex;gap:10px;align-items:center}
.say .bubble{padding:9px 12px;font-size:.92rem}
/* финальный салют */
.stage{position:relative;height:170px;display:grid;place-items:end center;margin-bottom:6px}
.fw{position:absolute;width:6px;height:6px;border-radius:50%;left:50%;top:50%;opacity:0}
.fw.go{animation:fw 1.3s ease-out forwards}
@keyframes fw{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.4)}}
.trophy{position:absolute;top:62px;left:calc(50% + 92px);transform:translateX(-50%);font-size:2.6rem;animation:drop .9s cubic-bezier(.3,1.6,.5,1) .3s both}
@keyframes drop{0%{transform:translate(-50%,-60px) scale(.3);opacity:0}100%{transform:translate(-50%,0) scale(1);opacity:1}}
.hero{display:flex;gap:14px;align-items:center}
.bubble{background:var(--card);border:1px solid var(--line);border-radius:18px 18px 18px 6px;padding:12px 14px;font-weight:500;box-shadow:var(--shadow);flex:1;min-width:0}
/* choices */
.who{display:grid;gap:10px}
.whob{display:flex;align-items:center;gap:14px;text-align:left;padding:16px;border-radius:18px;background:var(--card);border:2px solid var(--line);box-shadow:var(--shadow);transition:transform .12s,border-color .12s;width:100%}
.whob:hover{transform:translateY(-2px);border-color:var(--sky)}
.whob .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:1.6rem;flex:none}
.whob b{font-family:var(--display);font-weight:700;font-size:1.05rem;display:block}
.whob span{color:var(--ink-2);font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 14px;border-radius:14px;background:var(--card-2);border:2px solid var(--line);font-weight:600}
.chip.on{background:var(--sun-soft);border-color:var(--sun);color:var(--ink)}
.field{display:flex;flex-direction:column;gap:8px}
.inp{width:100%;padding:13px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card-2);font-weight:600}
.inp:focus{border-color:var(--sky);outline:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--display);font-weight:700;font-size:1rem;padding:15px 22px;border-radius:16px;background:var(--ink);color:var(--ground);width:100%;transition:transform .1s}
.btn:hover{transform:translateY(-1px)}
a.btn{text-decoration:none}
.btn.sun{background:var(--sun);color:var(--sun-ink)}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 180px}
/* game */
.hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pts{font-family:var(--display);font-weight:800;font-size:1.3rem;font-variant-numeric:tabular-nums}
.pill{font-size:.78rem;font-weight:700;padding:5px 10px;border-radius:20px;background:var(--card);border:1px solid var(--line);white-space:nowrap}
.pill.fire{background:var(--sun-soft);border-color:var(--sun)}
.track{display:flex;gap:5px}
.track i{flex:1;height:8px;border-radius:6px;background:var(--line)}
.track i.ok{background:var(--mint)} .track i.bad{background:var(--coral)} .track i.cur{background:var(--sky)} .track i.bz{background:var(--sun)}
.qcard{text-align:center;position:relative;overflow:hidden}
.qmeta{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:10px}
.big{font-size:clamp(2.4rem,11vw,3.4rem);line-height:1.1;margin:4px 0 10px;letter-spacing:.08em}
.qt{font-family:var(--display);font-weight:700;font-size:clamp(1.1rem,4.6vw,1.35rem);line-height:1.3}
.timer{height:5px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:14px}
.timer i{display:block;height:100%;background:var(--sky);width:100%;transform-origin:left;transition:transform .2s linear}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;background:var(--card);border:2px solid var(--line);font-weight:600;font-size:1.02rem;text-align:left;box-shadow:var(--shadow);width:100%;transition:transform .1s,border-color .1s}
.opt:hover:not([disabled]){transform:translateY(-2px);border-color:var(--sky)}
.opt .k{width:32px;height:32px;border-radius:10px;background:var(--card-2);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:.85rem;flex:none}
.opt.right{border-color:var(--mint);background:var(--mint-soft)}
.opt.wrong{border-color:var(--coral);background:var(--coral-soft);animation:shake .4s}
.opt.gone{opacity:.25}
.opt[disabled]{cursor:default}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.tf{grid-template-columns:1fr 1fr}
.tf .opt{justify-content:center;font-family:var(--display);font-size:1.05rem;padding:18px}
.fact{border-radius:18px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.fact.ok{background:var(--mint-soft)} .fact.bad{background:var(--coral-soft)}
.fact b{display:block;font-family:var(--display);font-size:.95rem;margin-bottom:2px}
.fact .fx{font-size:1.5rem;line-height:1}
.help{display:flex;gap:8px;justify-content:center}
.help .pill{cursor:pointer}
.help .pill[disabled]{opacity:.35;cursor:default}
.pop{position:fixed;left:50%;top:38%;transform:translateX(-50%);font-family:var(--display);font-weight:800;font-size:1.6rem;color:var(--mint);pointer-events:none;animation:pop 1s ease-out forwards;z-index:30;text-shadow:0 2px 0 var(--card)}
@keyframes pop{0%{opacity:1;transform:translate(-50%,0) scale(.7)}100%{opacity:0;transform:translate(-50%,-90px) scale(1.2)}}
/* blitz */
.bz-ex{font-family:var(--display);font-weight:800;font-size:clamp(2rem,9vw,2.6rem);font-variant-numeric:tabular-nums;margin:8px 0 14px}
.bz-opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.bz-opts .opt{justify-content:center;font-family:var(--display);font-size:1.25rem;padding:16px 8px}
.bz-top{display:flex;justify-content:space-between;align-items:center}
.clock{font-family:var(--display);font-weight:800;font-size:1.5rem;font-variant-numeric:tabular-nums}
.clock.low{color:var(--coral)}
/* duo */
.turn{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:16px;background:var(--sky-soft);font-weight:700}
.score2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.score2 .s{padding:12px;border-radius:16px;background:var(--card);border:2px solid var(--line);text-align:center}
.score2 .s.act{border-color:var(--sky)}
.score2 .s b{font-family:var(--display);font-size:1.4rem;display:block}
/* result */
.res{text-align:center}
.rank{font-family:var(--display);font-weight:800;font-size:clamp(1.5rem,6vw,2rem);line-height:1.1;margin:6px 0}
.medal{font-size:3.6rem;line-height:1;display:inline-block;animation:medal .8s ease}
@keyframes medal{0%{transform:scale(0) rotate(-25deg)}60%{transform:scale(1.2) rotate(6deg)}100%{transform:scale(1)}}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.stats div{background:var(--card-2);border-radius:14px;padding:10px 6px}
.stats b{font-family:var(--display);font-size:1.25rem;display:block;font-variant-numeric:tabular-nums}
.stats span{font-size:.75rem;color:var(--ink-3);font-weight:600}
.subj{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.subj .pill.good{background:var(--mint-soft);border-color:var(--mint)}
.subj .pill.weak{background:var(--coral-soft);border-color:var(--coral)}
.offer{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.offer h2{color:var(--sun)}
.offer p{margin:8px 0 14px;color:inherit;opacity:.9}
.offer ul{margin:0 0 16px;padding-left:18px;display:grid;gap:4px}
.foot{text-align:center;color:var(--ink-3);font-size:.8rem}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* ---------- блиц ---------- */
function blitzItem(b){
  let x,y,ans,txt;
  if(b==='A'){ if(Math.random()<.5){x=rnd(1,10);y=rnd(1,10);ans=x+y;txt=`${x} + ${y}`;} else {x=rnd(6,20);y=rnd(1,x);ans=x-y;txt=`${x} − ${y}`;} }
  else if(b==='B'){ if(Math.random()<.6){x=rnd(2,9);y=rnd(2,9);ans=x*y;txt=`${x} × ${y}`;} else {x=rnd(20,70);y=rnd(10,29);ans=x+y;txt=`${x} + ${y}`;} }
  else if(b==='C'){ const r=Math.random(); if(r<.4){y=rnd(3,9);ans=rnd(3,12);x=ans*y;txt=`${x} : ${y}`;} else if(r<.8){x=rnd(12,25);y=rnd(3,6);ans=x*y;txt=`${x} × ${y}`;} else {x=rnd(100,500);y=rnd(20,99);ans=x-y;txt=`${x} − ${y}`;} }
  else if(b==='D'){ const r=Math.random(); if(r<.35){x=rnd(2,15);y=rnd(x+1,25);ans=x-y;txt=`${x} − ${y}`;} else if(r<.7){const p=[10,20,25,50][rnd(0,3)];x=rnd(2,20)*20;ans=x*p/100;txt=`${p}% от ${x}`;} else {x=rnd(-9,-2);y=rnd(2,9);ans=x*y;txt=`${x} · ${y}`;} }
  else { const r=Math.random(); if(r<.4){x=rnd(11,19);ans=x*x;txt=`${x}²`;} else if(r<.7){x=rnd(2,5);y=rnd(2,x===2?8:4);ans=Math.pow(x,y);txt=`${x}${['','','²','³','⁴','⁵','⁶','⁷','⁸'][y]}`;} else {const p=[15,30,40,75][rnd(0,3)];x=rnd(2,12)*20;ans=x*p/100;txt=`${p}% от ${x}`;} }
  const set=new Set([ans]); let guard=0;
  while(set.size<3&&guard++<50){ const d=[1,2,10,-1,-2,-10,5,-5][rnd(0,7)]; const w=ans+d; if(b==='A'&&w<0) continue; set.add(w); }
  return {txt,ans,opts:shuffle([...set])};
}

/* ---------- сборка игры ---------- */
function pick(band,n,interests,exclude){
  const pool=shuffle(Q[band].filter(q=>!(exclude||[]).includes(q)));
  const favS=new Set(); (interests||[]).forEach(id=>{const i=INTERESTS.find(x=>x.id===id); if(i) i.s.forEach(s=>favS.add(s));});
  const fav=pool.filter(q=>favS.has(q.s)), rest=pool.filter(q=>!favS.has(q.s));
  const out=[], cnt={};
  const tryAdd=q=>{ if(out.length>=n||out.includes(q)) return; if((cnt[q.s]||0)>=3) return; out.push(q); cnt[q.s]=(cnt[q.s]||0)+1; };
  fav.slice(0,Math.ceil(n/2)).forEach(tryAdd); rest.forEach(tryAdd); pool.forEach(tryAdd);
  // чередуем типы: эмодзи и «верю не верю» не подряд
  return spread(out);
}
function spread(arr){ const a=arr.filter(q=>!q.big&&q.tf===undefined), b=arr.filter(q=>q.big||q.tf!==undefined), out=[]; while(a.length||b.length){ if(a.length) out.push(a.shift()); if(a.length) out.push(a.shift()); if(b.length) out.push(b.shift()); } return out; }
function prep(q){ const c={...q}; if(q.a){ c.correct=q.a[0]; c.opts=q.a.length>2?shuffle(q.a):q.a.slice(); } return c; }
function startGame(){
  clearTimers();
  const kidName=S.name||'Игрок';
  if(S.mode==='duo'){
    const kq=pick(S.band,5,[]), pq=pick('P',5,[]);
    const seq=[]; for(let i=0;i<5;i++){ seq.push({...prep(kq[i]),who:0}); seq.push({...prep(pq[i]),who:1}); }
    G={seq,i:0,players:[{name:kidName,pts:0,ok:0},{name:S.parentName||'Взрослый',pts:0,ok:0}],res:[],streak:0,best:0,fifty:[true,true],used50:false};
  } else {
    const band=S.mode==='adult'?'P':S.band;
    const qs=pick(band,9,S.interests).map(prep);
    const seq=[...qs.slice(0,5),{blitz:true},...qs.slice(5)];
    G={seq,i:0,players:[{name:kidName,pts:0,ok:0}],res:[],streak:0,best:0,fifty:[true],used50:false,blitzScore:0};
  }
  S.screen='intro'; render();
}

  if(S.mode==='duo') txt=`${esc(G.players[0].name)} против ${esc(G.players[1].name)}! По 5 вопросов каждому, отвечаете по очереди. Кто быстрее отвечает, получает бонус ⚡. Передавайте телефон друг другу. Удачи!`;
  else if(S.mode==='adult') txt=`${S.name?esc(S.name)+', в':'В'}ас ждут 10 раундов из школьной программы: русский, математика, история, природа и немного Пушкина. Отвечайте быстро: за скорость бонус ⚡. Одна подсказка «50/50» на игру.`;
  else txt=`${S.name?esc(S.name)+', т':'Т'}ебя ждут 10 раундов! Обычные вопросы, загадки по эмодзи, «верю не верю» и блиц по счёту на 20 секунд. За правильный ответ 100 очков, за быстрый ещё бонус ⚡. Если трудно, есть одна подсказка «50/50».`;
  w.appendChild($(`<div class="hero">${mys()}<div class="bubble">${txt}</div></div>`));
  const rules=$(`<div class="row small muted" style="justify-content:space-between"><span>✅ 100 очков</span><span>⚡ до +50 за скорость</span><span>🔥 серия ×1,5</span></div>`);
  w.appendChild(rules);
  const go=$('<button class="btn sun">Я готов(а)!</button>'); go.onclick=()=>next(true);
  w.appendChild(go);
  return w;
}

/* ---------- ход игры ---------- */
let tick=null, bzTick=null;
const THINK=['Хм, интересный вопрос…','Думаю вместе с тобой 🤔','Не торопись, но и не зевай ⏱️','Этот я бы тоже решил!','Включаем смекалку 💡'];
const YAY=['Ура! Лампочка горит! 💡','Вот это смекалка!','Точно в цель 🎯','Ты молодец!','Ещё так же!'];
const OOPS=['Ой… ничего, запомним 🙂','Бывает! Теперь ты знаешь','Почти! Следующий будет твой','Не беда, идём дальше']
function clearTimers(){ clearInterval(tick); clearInterval(bzTick); tick=bzTick=null; }
function next(first){
  clearTimers();
  if(!first) G.i++;
  if(G.i>=G.seq.length){ S.screen='result'; render(); confetti(); fireworks(); if(S.sound){beep(true);setTimeout(()=>beep(true),180);} return; }
  G.cur=G.seq[G.i]; G.answered=null; G.t0=Date.now(); G.hidden=[];
  S.screen=G.cur.blitz?'blitz':'play'; render();
  if(!G.cur.blitz) startQTimer();
}
const QTIME=20;
function startQTimer(){
  tick=setInterval(()=>{ const el=document.querySelector('.timer i'); if(!el||G.answered) return;
    const left=Math.max(0,1-(Date.now()-G.t0)/1000/QTIME); el.style.transform=`scaleX(${left})`;
    if(left<=0){ answer(null); } },200);
}
function track(){ const t=$('<div class="track"></div>'); G.seq.forEach((q,i)=>{ const r=G.res[i]; t.appendChild($(`<i class="${r?(r.blitz?'bz':(r.ok?'ok':'bad')):(i===G.i?'cur':'')}"></i>`)); }); return t; }
function hud(){
  const h=$('<div class="hud"></div>');
  if(S.mode==='duo'){
    const sc=$(`<div class="score2" style="flex:1">${G.players.map((p,k)=>`<div class="s ${G.cur&&G.cur.who===k?'act':''}"><span class="small muted">${esc(p.name)}</span><b>${p.pts}</b></div>`).join('')}</div>`);
    h.appendChild(sc);
  } else {
    h.appendChild($(`<span class="pts">${G.players[0].pts}</span>`)); h.appendChild($('<span class="muted small">очков</span>'));
    h.appendChild($('<span class="sp"></span>'));
    if(G.streak>=2) h.appendChild($(`<span class="pill fire">🔥 ${G.streak} подряд</span>`));
  }
  return h;
}
function Play(){
  const q=G.cur, w=$('<div class="wrap" style="gap:12px"></div>');
  w.appendChild(hud()); w.appendChild(track());
  const who=S.mode==='duo'?G.players[q.who].name:'';
  const line=!G.answered?(who?`${esc(who)}, твой ход! Думай 🤔`:THINK[G.i%THINK.length]):(G.answered.ok?YAY[G.i%YAY.length]:OOPS[G.i%OOPS.length]);
  w.appendChild($(`<div class="say">${mys(!G.answered?'think':(G.answered.ok?'yay':'oops'),'sm')}<div class="bubble">${line}</div></div>`));
  const kind=q.big?'Загадка по эмодзи':q.tf!==undefined?'Верю не верю':SUBJ[q.s]||'';
  const c=$(`<div class="card qcard"><div class="qmeta"><span class="label">Раунд ${G.i+1} из ${G.seq.length}</span><span class="pill">${esc(kind)}</span></div>
    ${q.big?`<div class="big">${q.big}</div>`:''}<div class="qt">${esc(q.q)}</div>
    <div class="timer"><i></i></div></div>`);
  if(G.answered) c.querySelector('.timer').remove();
  w.appendChild(c);
  let opts;
  if(q.tf!==undefined){
    opts=$('<div class="opts tf"></div>');
    [[true,'👍 Верю'],[false,'👎 Не верю']].forEach(([v,l])=>{ const b=$(`<button class="opt">${l}</button>`);
      if(G.answered){ b.disabled=true; if(v===q.tf) b.classList.add('right'); else if(G.answered.v===v) b.classList.add('wrong'); }
      b.onclick=()=>answer(v); opts.appendChild(b); });
  } else {
    opts=$('<div class="opts"></div>'); const L=['А','Б','В','Г'];
    q.opts.forEach((o,i)=>{ const b=$(`<button class="opt"><span class="k">${L[i]}</span><span>${esc(o)}</span></button>`);
      if(G.hidden.includes(o)){ b.disabled=true; b.classList.add('gone'); }
      if(G.answered){ b.disabled=true; if(o===q.correct) b.classList.add('right'); else if(G.answered.v===o) b.classList.add('wrong'); }
      b.onclick=()=>answer(o); opts.appendChild(b); });
  }
  w.appendChild(opts);
  if(!G.answered){
    const pk=S.mode==='duo'?q.who:0;
    const can=q.a&&q.opts.length>=4&&G.fifty[pk];
    const h=$(`<div class="help"><button class="pill" id="f50" ${can?'':'disabled'}>🎯 50/50</button></div>`);
    h.querySelector('#f50').onclick=()=>{ if(!can) return; G.fifty[pk]=false; G.hidden=shuffle(q.opts.filter(o=>o!==q.correct)).slice(0,2); render(); };
    w.appendChild(h);
  } else {
    const r=G.answered;
    w.appendChild($(`<div class="fact ${r.ok?'ok':'bad'}"><span class="fx">${r.ok?'🎉':'💡'}</span><div><b>${r.ok?`Верно! +${r.gain}`:(r.v===null?'Время вышло':'Мимо')+'. Ответ: '+esc(q.tf!==undefined?(q.tf?'правда':'неправда'):q.correct)}</b>${esc(q.f||'')}</div></div>`));
    const nx=$(`<button class="btn">${G.i+1>=G.seq.length?'Итоги 🏁':'Дальше →'}</button>`); nx.onclick=()=>next(); w.appendChild(nx);
  }
  return w;
}
function answer(v){
  if(G.answered) return;
  clearTimers();
  const q=G.cur, ok=v!==null && (q.tf!==undefined? v===q.tf : v===q.correct);
  const sec=(Date.now()-G.t0)/1000, p=G.players[S.mode==='duo'?q.who:0];
  let gain=0;
  if(ok){ gain=100+(sec<=5?50:sec<=10?25:0); if(S.mode!=='duo'){ G.streak++; if(G.streak>=3) gain=Math.round(gain*1.5);} p.pts+=gain; p.ok++; }
  else if(S.mode!=='duo') G.streak=0;
  G.best=Math.max(G.best,G.streak);
  G.answered={v,ok,gain}; G.res[G.i]={ok,s:q.s,who:q.who};
  beep(ok); render();
  if(ok){ const e=document.createElement('div'); e.className='pop'; e.textContent='+'+gain; document.body.appendChild(e); setTimeout(()=>e.remove(),1000); }
}

/* ---------- блиц ---------- */
const BZ=20;
function Blitz(){
  const w=$('<div class="wrap" style="gap:12px"></div>');
  w.appendChild(hud()); w.appendChild(track());
  const band=S.mode==='adult'?'C':S.band;
  if(!G.bz){ G.bz={started:false,done:false,ok:0,bad:0,item:blitzItem(band),band}; }
  const bz=G.bz;
  w.appendChild($(`<div class="say">${mys(bz.done?(bz.ok>=4?'yay':'oops'):(bz.started?'think':'idle'),'sm')}<div class="bubble">${bz.done?(bz.ok>=4?'Быстрее калькулятора! ⚡':'Разогрелись! Дальше будет лучше'):(bz.started?'Жми быстрее! 🔥':'Сейчас проверим скорость!')}</div></div>`));
  const c=$('<div class="card qcard"></div>');
  if(!bz.started){
    c.appendChild($(`<div class="qmeta"><span class="label">Раунд ${G.i+1} из ${G.seq.length}</span><span class="pill fire">⚡ Блиц</span></div>`));
    c.appendChild($(`<div class="big">⏱️</div><div class="qt">Блиц: реши как можно больше примеров за ${BZ} секунд</div><div class="muted small" style="margin:8px 0 16px">Каждый верный пример +30 очков. Ошибка ничего не отнимает.</div>`));
    const go=$('<button class="btn sun">Старт!</button>'); go.onclick=()=>{ bz.started=true; bz.end=Date.now()+BZ*1000; render(); bzTick=setInterval(()=>{ const el=document.getElementById('bzc'); const left=Math.max(0,Math.ceil((bz.end-Date.now())/1000)); if(el){ el.textContent=left; el.classList.toggle('low',left<=5);} if(left<=0) finishBlitz(); },250); };
    c.appendChild(go); w.appendChild(c); return w;
  }
  if(!bz.done){
    const left=Math.max(0,Math.ceil((bz.end-Date.now())/1000));
    c.appendChild($(`<div class="bz-top"><span class="pill">✅ ${bz.ok}</span><span class="clock ${left<=5?'low':''}" id="bzc">${left}</span></div>`));
    c.appendChild($(`<div class="bz-ex">${bz.item.txt} = ?</div>`));
    const o=$('<div class="bz-opts"></div>');
    bz.item.opts.forEach(v=>{ const b=$(`<button class="opt">${v}</button>`); b.onclick=()=>{ if(bz.done) return; const ok=v===bz.item.ans; if(ok){bz.ok++;} else bz.bad++; beep(ok); bz.item=blitzItem(bz.band); render(); }; o.appendChild(b); });
    c.appendChild(o); w.appendChild(c); return w;
  }
  const gain=bz.ok*30;
  c.appendChild($(`<div class="big">${bz.ok>=8?'🚀':bz.ok>=4?'⚡':'🐢'}</div><div class="qt">Решено примеров: ${bz.ok}</div><div class="muted" style="margin:6px 0 16px">+${gain} очков${bz.ok>=8?'. Скорость как у калькулятора!':bz.ok>=4?'. Хороший темп!':'. В следующий раз получится быстрее.'}</div>`));
  const nx=$(`<button class="btn">Дальше →</button>`); nx.onclick=()=>{ G.bz=null; next(); }; c.appendChild(nx);
  w.appendChild(c); return w;
}
function finishBlitz(){ const bz=G.bz; if(!bz||bz.done) return; clearTimers(); bz.done=true; const gain=bz.ok*30; G.players[0].pts+=gain; G.blitzScore=bz.ok; G.res[G.i]={blitz:true,ok:true}; render(); }

/* ---------- итоги ---------- */
function rankKid(p){ return p>=1?['🏆','Легенда Смекай']:p>=.8?['🥇','Главный умник']:p>=.6?['🥈','Смекалистый']:p>=.4?['🥉','Растущий мыслитель']:['🌱','Разминка засчитана']; }
function rankAdult(p){ return p>=.9?['🏆','Школу помните на пятёрку']:p>=.7?['🥇','Твёрдая четвёрка']:p>=.5?['🥈','Пора освежить']:['📚','Дети вас подтянут']; }
function Result(){
  const w=$('<div class="wrap" style="gap:14px"></div>');
  const qRes=G.res.filter(r=>r&&!r.blitz);
  if(S.mode==='duo'){
    const [a,b]=G.players; const win=a.pts===b.pts?null:(a.pts>b.pts?a:b);
    const c=$(`<div class="card res">${stage(win?'👑':'🤝')}<div class="rank">${win?esc(win.name)+' побеждает!':'Ничья!'}</div>
      <div class="score2" style="margin-top:12px">${G.players.map(p=>`<div class="s ${win===p?'act':''}"><span class="small muted">${esc(p.name)}</span><b>${p.pts}</b><span class="small muted">верно ${p.ok} из 5</span></div>`).join('')}</div></div>`);
    w.appendChild(c);
    w.appendChild(offer(`${esc(a.name)} ответил(а) на ${a.ok} из 5 вопросов своего класса. Хотите, чтобы Мыслик каждый день помогал с домашкой и показывал вам, где трудно?`));
  } else {
    const n=qRes.length, ok=qRes.filter(r=>r.ok).length, pct=n?ok/n:0;
    const [md,rk]=S.mode==='adult'?rankAdult(pct):rankKid(pct);
    const bySub={}; qRes.forEach(r=>{ bySub[r.s]=bySub[r.s]||[0,0]; bySub[r.s][1]++; if(r.ok) bySub[r.s][0]++; });
    const subs=Object.entries(bySub).map(([s,[o,t]])=>`<span class="pill ${o===t?'good':o===0?'weak':''}">${SUBJ[s]||s} ${o}/${t}</span>`).join('');
    const c=$(`<div class="card res">${stage(md)}<div class="rank">${esc(rk)}</div>
      <div class="muted">${S.name?esc(S.name)+', в':'В'}ерно ${ok} из ${n}${S.mode==='adult'?' по школьной программе':''}</div>
      <div class="stats"><div><b>${G.players[0].pts}</b><span>очков</span></div><div><b>${G.blitzScore||0}</b><span>примеров в блице</span></div><div><b>${G.best}</b><span>лучшая серия</span></div></div>
      <div class="subj">${subs}</div></div>`);
    w.appendChild(c);
    const weak=Object.entries(bySub).filter(([s,[o,t]])=>o<t).map(([s])=>SUBJ[s]);
    if(S.mode==='adult'){
      const kidsTxt=S.kids.filter(k=>k!=='none').map(k=>GRADES.find(g=>g.b===k).g).join(', ');
      w.appendChild(offer(kidsTxt?`Ваш ребёнок (${esc(kidsTxt)}) каждый день сталкивается с такими вопросами. Мыслик объясняет их по шагам, не решает за ребёнка и присылает вам отчёт.`:`Понравилось? В канале Смекай каждую неделю новые викторины для детей и взрослых.`, !kidsTxt));
    } else {
      w.appendChild(offer(`${weak.length?'Есть над чем поработать: '+esc(weak.slice(0,2).join(', '))+'. ':''}Мыслик может помогать тебе с домашкой каждый день: объясняет по шагам, даёт подсказки и игры по твоим темам.`));
    }
  }
  const again=$('<div class="row"></div>');
  const a1=$('<button class="btn ghost">🔁 Ещё раунд</button>'); a1.onclick=()=>startGame();
  const a2=$('<button class="btn ghost">📣 Позвать друга</button>'); a2.onclick=share;
  again.appendChild(a1); again.appendChild(a2);
  w.appendChild(again);
  const a3=$('<button class="btn ghost">⚔️ Семейная дуэль</button>'); a3.onclick=()=>{ S.mode='duo'; S.screen='duo'; render(); };
  if(S.mode!=='duo') w.appendChild(a3);
  w.appendChild($('<div class="foot">Смекай · помощник по учёбе Мыслик для 1–8 класса</div>'));
  return w;
}
function offer(text,channelOnly){
  const o=$(`<div class="card offer"><h2>${channelOnly?'Новые викторины каждую неделю':'Учиться с Мысликом'}</h2><p>${text}</p>
    ${channelOnly?'':`<ul><li>Разбор домашки по шагам, без готовых ответов</li><li>Тесты-игры по учебникам вашего класса</li><li>Отчёт родителю: что получилось, где трудно</li></ul>`}
    <div class="row"></div></div>`);
  const r=o.querySelector('.row');
  if(!channelOnly){ const b=$(`<a class="btn sun" href="${LINKS.bot}" target="_blank" rel="noopener">Попробовать Мыслика</a>`); r.appendChild(b); }
  const c=$(`<a class="btn ghost" href="${LINKS.channel}" target="_blank" rel="noopener" style="background:transparent;color:inherit;border-color:rgba(255,255,255,.3)">Канал в Telegram</a>`); r.appendChild(c);
  const mx=$(`<a class="btn ghost" href="${LINKS.max}" target="_blank" rel="noopener" style="background:transparent;color:inherit;border-color:rgba(255,255,255,.3)">Канал в MAX</a>`); r.appendChild(mx);
  return o;
}
function share(){
  const p=G.players[0];
  const txt=S.mode==='duo'?`Сыграли в семейную дуэль Смекай: ${G.players[0].name} ${G.players[0].pts} : ${G.players[1].pts} ${G.players[1].name}. А вы?`:`Я набрал(а) ${p.pts} очков в викторине Смекай. Сможешь больше?`;
  window.open('https://t.me/share/url?url='+encodeURIComponent('https://smekairu.github.io/Smekai/')+'&text='+encodeURIComponent(txt),'_blank','noopener');
}

/* ---------- финальная анимация ---------- */
function stage(icon){ return `<div class="stage"><span class="trophy">${icon}</span>${mys('party','lg')}</div>`; }
function fireworks(){
  const st=document.querySelector('.stage'); if(!st) return;
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cols=['#FFC933','#3E7BFA','#20B98A','#F2564B','#FF8FA3'];
  [0,450,900,1500].forEach((d,k)=>setTimeout(()=>{ const cx=[30,70,50,20][k]+'%', cy=[25,20,10,35][k]+'%';
    for(let i=0;i<18;i++){ const e=document.createElement('i'); e.className='fw'; const a=i/18*Math.PI*2, r=40+Math.random()*25;
      e.style.left=cx; e.style.top=cy; e.style.background=cols[i%cols.length]; e.style.setProperty('--dx',Math.cos(a)*r+'px'); e.style.setProperty('--dy',Math.sin(a)*r+'px');
      st.appendChild(e); requestAnimationFrame(()=>e.classList.add('go')); setTimeout(()=>e.remove(),1400); }
  },d));
}

/* ---------- конфетти ---------- */
function confetti(){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv=document.createElement('canvas'); cv.className='confetti'; cv.width=innerWidth; cv.height=innerHeight; document.body.appendChild(cv);
  const ctx=cv.getContext('2d'), cols=['#FFC933','#3E7BFA','#20B98A','#F2564B'];
  const ps=Array.from({length:110},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,r:3+Math.random()*5,vy:2+Math.random()*3,vx:-1.5+Math.random()*3,c:cols[Math.random()*4|0],a:Math.random()*6}));
  let f=0;(function loop(){ ctx.clearRect(0,0,cv.width,cv.height); ps.forEach(p=>{p.y+=p.vy;p.x+=p.vx;p.a+=.1;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);ctx.restore();}); if(++f<140) requestAnimationFrame(loop); else cv.remove(); })();
}

render();
</script>

</body></html>
