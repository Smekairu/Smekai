name: Проверить MAX

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Сертификаты НУЦ Минцифры (нужны для MAX)
        run: |
          set -e
          curl -fsSL -o root.cer https://gu-st.ru/content/Other/doc/russian_trusted_root_ca.cer
          curl -fsSL -o sub.cer  https://gu-st.ru/content/Other/doc/russian_trusted_sub_ca.cer
          for f in root sub; do
            openssl x509 -in $f.cer -out $f.pem 2>/dev/null || openssl x509 -inform DER -in $f.cer -out $f.pem
          done
          sudo cp root.pem /usr/local/share/ca-certificates/russian_trusted_root_ca.crt
          sudo cp sub.pem  /usr/local/share/ca-certificates/russian_trusted_sub_ca.crt
          sudo update-ca-certificates
          echo "SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt" >> $GITHUB_ENV
          rm -f root.cer sub.cer root.pem sub.pem
      - run: python scripts/max_chat.py
        env:
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
