name: Проверить MAX

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/max_chat.py
        env:
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
