name: Подключить ботов к серверу

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      SERVER_HOST: 135.106.229.87
      SERVER_USER: github-deploy
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
      YOOKASSA_SHOP_ID: ${{ secrets.YOOKASSA_SHOP_ID }}
      YOOKASSA_SECRET: ${{ secrets.YOOKASSA_SECRET }}
      YOOKASSA_RECEIPT: ${{ vars.YOOKASSA_RECEIPT }}
      REVIEW_LOGIN: ${{ secrets.REVIEW_LOGIN }}
      REVIEW_PASSWORD: ${{ secrets.REVIEW_PASSWORD }}

    steps:
      - name: Проверить обязательные секреты
        shell: bash
        run: |
          test -n "$TG_BOT_TOKEN"
          test -n "$MAX_BOT_TOKEN"

      - name: Подготовить защищённое подключение
        shell: bash
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          test -n "$SERVER_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '135.106.229.87 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJSNwJTsHZUe8Htc1Z3Xe9hTtR3uM1/P/yPKMXOHBVEr' > ~/.ssh/known_hosts

      - name: Собрать закрытые настройки
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          values = {
              "SITE_URL": "https://myslik.ru/",
              "API_PUBLIC": "https://myslik.ru",
              "SITE_ORIGINS": "https://myslik.ru,https://www.myslik.ru",
              "PORT": "8080",
              "DB_PATH": "/var/lib/myslik/myslik.db",
              "AI_PROVIDER": "none",
              "SUB_DAYS": "30",
              "FREE_LIMIT": "3",
              "PAID_LIMIT": "30",
              "TG_BOT_TOKEN": os.environ.get("TG_BOT_TOKEN", ""),
              "TG_CHANNEL": "@smekai_ru",
              "MAX_BOT_TOKEN": os.environ.get("MAX_BOT_TOKEN", ""),
              "REVIEW_LOGIN": os.environ.get("REVIEW_LOGIN", ""),
              "REVIEW_PASSWORD": os.environ.get("REVIEW_PASSWORD", ""),
          }
          shop_id = os.environ.get("YOOKASSA_SHOP_ID", "").strip()
          secret = os.environ.get("YOOKASSA_SECRET", "").strip()
          if bool(shop_id) != bool(secret):
              raise SystemExit("YOOKASSA_SHOP_ID и YOOKASSA_SECRET должны быть заданы вместе")
          if shop_id:
              values.update({
                  "YOOKASSA_SHOP_ID": shop_id,
                  "YOOKASSA_SECRET": secret,
                  "YOOKASSA_RECEIPT": "1" if os.environ.get("YOOKASSA_RECEIPT") == "1" else "0",
              })
          for name, value in values.items():
              if "\n" in value or "\r" in value:
                  raise SystemExit(f"Недопустимый перенос строки в {name}")
          Path("myslik.env").write_text(
              "".join(f"{name}={value}\n" for name, value in values.items()),
              encoding="utf-8",
          )
          PY
          chmod 600 myslik.env

      - name: Передать настройки и запустить ботов
        shell: bash
        run: |
          scp -q myslik.env "$SERVER_USER@$SERVER_HOST:/home/github-deploy/myslik.env"
          ssh "$SERVER_USER@$SERVER_HOST" '
            sudo /usr/local/sbin/myslik-install-env &&
            sleep 5 &&
            systemctl --quiet is-active myslik-api myslik-telegram myslik-max &&
            curl -fsS http://127.0.0.1:8080/health
          '

      - name: Удалить временные закрытые файлы
        if: always()
        shell: bash
        run: |
          rm -f myslik.env ~/.ssh/id_ed25519
