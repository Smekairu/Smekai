name: Публикация постов

on:
  schedule:
    - cron: "0 6,9,12,15,18 * * *"   # 09:00, 12:00, 15:00, 18:00, 21:00 по Москве
  workflow_dispatch: {}       # ручной запуск кнопкой Run workflow

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Отправить посты, у которых подошло время
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHANNEL: ${{ vars.TG_CHANNEL }}
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          MAX_CHAT_ID: ${{ vars.MAX_CHAT_ID }}
          QUIZ_URL: ${{ vars.QUIZ_URL }}
        run: python scripts/publish.py
      - name: Сохранить отметки об отправке
        run: |
          git config user.name "smekai-bot"
          git config user.email "smekai-bot@users.noreply.github.com"
          git add state/published.json
          git diff --cached --quiet || git commit -m "Отмечены опубликованные посты"
          git push
