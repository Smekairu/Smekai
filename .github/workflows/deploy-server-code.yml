name: Обновить код на сервере

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Подготовить защищённое подключение
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          test -n "$SERVER_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '135.106.229.87 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJSNwJTsHZUe8Htc1Z3Xe9hTtR3uM1/P/yPKMXOHBVEr' > ~/.ssh/known_hosts

      - name: Проверить права развёртывания
        run: |
          ssh github-deploy@135.106.229.87 '
            sudo -n -l
            stat -c "%U:%G %A %n" /opt/myslik /opt/myslik/bot /usr/local/sbin/myslik-install-env
            test -w /opt/myslik && echo OPT_WRITABLE=yes || echo OPT_WRITABLE=no
          '

      - name: Удалить временный ключ
        if: always()
        run: rm -f ~/.ssh/id_ed25519
