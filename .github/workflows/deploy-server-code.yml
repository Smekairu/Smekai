name: Обновить код на сервере

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Подготовить защищённое подключение
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          test -n "$SERVER_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '135.106.229.87 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJSNwJTsHZUe8Htc1Z3Xe9hTtR3uM1/P/yPKMXOHBVEr' > ~/.ssh/known_hosts

      - name: Собрать и передать код
        run: |
          tar --exclude=.git --exclude=bot/.venv --exclude=bot/myslik.db --exclude=state/pydeps -czf "$RUNNER_TEMP/myslik-code.tar.gz" .
          find . -maxdepth 1 -type f \( -name '*.html' -o -name robots.txt -o -name sitemap.xml -o -name .nojekyll \) -print0 > "$RUNNER_TEMP/site-files.list"
          find assets bank docs kabinet myslik viktorina zanyatie -type f -print0 >> "$RUNNER_TEMP/site-files.list"
          tar --null --no-recursion -czf "$RUNNER_TEMP/myslik-site.tar.gz" -T "$RUNNER_TEMP/site-files.list"
          scp -q "$RUNNER_TEMP/myslik-code.tar.gz" github-deploy@135.106.229.87:/home/github-deploy/myslik-code.tar.gz
          scp -q "$RUNNER_TEMP/myslik-site.tar.gz" github-deploy@135.106.229.87:/home/github-deploy/myslik-site.tar.gz

      - name: Установить свежий код
        run: |
          ssh github-deploy@135.106.229.87 '
            set -eu
            tar --no-overwrite-dir -xzf /home/github-deploy/myslik-code.tar.gz -C /opt/myslik
            test -w /var/www/myslik
            tar --unlink-first -xzf /home/github-deploy/myslik-site.tar.gz -C /var/www/myslik
            rm -f /home/github-deploy/myslik-code.tar.gz
            rm -f /home/github-deploy/myslik-site.tar.gz
            test -f /opt/myslik/bot/webhook.py
            curl -fsS http://127.0.0.1:8080/health
          '

      - name: Удалить временный ключ
        if: always()
        run: rm -f ~/.ssh/id_ed25519 "$RUNNER_TEMP/myslik-code.tar.gz" "$RUNNER_TEMP/myslik-site.tar.gz" "$RUNNER_TEMP/site-files.list"
